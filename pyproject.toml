[project]
name = "claude-context-relay"
version = "0.1.0"
description = "Claude Code hooks that hand off to a fresh session (/clear) instead of auto-compacting."
requires-python = ">=3.10"
dependencies = []  # stdlib only -- the hook runs with whatever Python is on PATH

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=context_relay", "--cov=install", "--cov-report=term-missing:skip-covered", "--cov-fail-under=85", "-q"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "S", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]
